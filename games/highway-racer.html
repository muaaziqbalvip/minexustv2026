<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Highway Racer — MINEXUS Games</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
*,*::before,*::as::after{box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#1a1a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;touch-action:none;user-select:none}
.top-bar{width:100%;max-width:380px;display:flex;justify-content:space-between;margin-bottom:10px}
.stat-box{background:rgba(255,255,255,.08);border-radius:8px;padding:8px 16px;text-align:center;min-width:60px}
.stat-label{font-size:9px;opacity:.7;text-transform:uppercase;font-weight:700}
.stat-val{font-size:16px;font-weight:900}
.board-wrap{position:relative;width:100%;max-width:380px;aspect-ratio:9/16;max-height:70vh;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.15)}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.overlay-text{font-size:24px;font-weight:900}
.overlay-sub{font-size:13px;opacity:.8}
.overlay-btn{background:#ffd54f;color:#3a2a00;border:none;border-radius:10px;padding:11px 24px;font-weight:900;cursor:pointer}
.controls{display:flex;gap:40px;margin-top:16px}
.ctrl-btn{width:64px;height:64px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.ctrl-btn:active{background:#ffd54f;color:#3a2a00}
.hint{margin-top:12px;font-size:12px;opacity:.7;text-align:center;max-width:320px;line-height:1.5}
</style>
</head>
<body>
<div class="top-bar">
  <div class="stat-box"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
  <div class="stat-box"><div class="stat-label">Best</div><div class="stat-val" id="best">0</div></div>
</div>
<div class="board-wrap" id="boardWrap">
  <canvas id="canvas"></canvas>
  <div class="overlay" id="overlay">
    <div class="overlay-text">🏎️ Highway Racer</div>
    <div class="overlay-sub">Dodge traffic, survive as long as you can</div>
    <button class="overlay-btn" id="overlayBtn">Start</button>
  </div>
</div>
<div class="controls">
  <button class="ctrl-btn" id="leftBtn">◀</button>
  <button class="ctrl-btn" id="rightBtn">▶</button>
</div>
<p class="hint">Swipe left/right, use arrow keys, or tap the buttons to change lanes. Works fully offline once downloaded.</p>
<script>
(function(){
'use strict';
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const boardWrap=document.getElementById('boardWrap');
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'), overlayBtn=document.getElementById('overlayBtn');
const STORAGE_BEST='minexus_racer_best';
function loadBest(){try{return parseInt(localStorage.getItem(STORAGE_BEST)||'0',10)||0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem(STORAGE_BEST,String(v));}catch(e){}}

let W,H,scale,laneW;
const LANES=3;
function resize(){
  const r=boardWrap.getBoundingClientRect();
  W=canvas.width=r.width; H=canvas.height=r.height; scale=W/380;
  laneW=W/LANES;
}

let playerLane, cars, score, best, running, speed, spawnTimer, roadOffset;

function reset(){
  playerLane=1; cars=[]; score=0; speed=4*scale; roadOffset=0; running=true;
  scoreEl.textContent='0';
  overlay.style.display='none';
  clearInterval(spawnTimer);
  spawnTimer=setInterval(()=>{ if(running) spawnCar(); }, Math.max(500, 1200-speed*40));
}

function spawnCar(){
  const lane=Math.floor(Math.random()*LANES);
  // Avoid stacking impossible walls across all 3 lanes at the same height.
  const recentSameRow = cars.filter(c=>c.y<40*scale).length;
  if(recentSameRow>=LANES-1) return;
  cars.push({ lane, y:-60*scale, color: ['#ff6b6b','#4dabf7','#69db7c','#ffd43b','#da77f2'][Math.floor(Math.random()*5)] });
}

function update(){
  if(!running) return;
  speed = Math.min(11*scale, speed+0.0025*scale);
  roadOffset = (roadOffset+speed) % (40*scale);
  score += 0.03;
  scoreEl.textContent = Math.floor(score);

  cars.forEach(c=> c.y += speed);
  cars = cars.filter(c=> c.y < H+80*scale);

  const carW=laneW*0.55, carH=90*scale;
  const px = playerLane*laneW + laneW/2;
  const py = H-100*scale;
  cars.forEach(c=>{
    const cx=c.lane*laneW+laneW/2;
    if(Math.abs(cx-px)<carW*0.9 && Math.abs(c.y-py)<carH*0.75){
      endGame();
    }
  });
}

function draw(){
  ctx.fillStyle='#333'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.setLineDash([20*scale,20*scale]); ctx.lineWidth=3*scale;
  for(let l=1;l<LANES;l++){
    ctx.beginPath();
    ctx.moveTo(l*laneW, roadOffset-40*scale);
    ctx.lineTo(l*laneW, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  const carW=laneW*0.55, carH=90*scale;
  cars.forEach(c=>{
    const cx=c.lane*laneW+laneW/2;
    ctx.fillStyle=c.color;
    ctx.fillRect(cx-carW/2, c.y-carH/2, carW, carH);
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.fillRect(cx-carW/2, c.y-carH/2+10*scale, carW, 14*scale);
  });

  const px=playerLane*laneW+laneW/2, py=H-100*scale;
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(px-carW/2, py-carH/2, carW, carH);
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.fillRect(px-carW/2, py-carH/2+carH-24*scale, carW, 14*scale);
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

function moveLane(d){
  if(!running) return;
  playerLane = Math.max(0, Math.min(LANES-1, playerLane+d));
}

document.getElementById('leftBtn').addEventListener('click', ()=>moveLane(-1));
document.getElementById('rightBtn').addEventListener('click', ()=>moveLane(1));
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'){ e.preventDefault(); moveLane(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); moveLane(1); }
});
let touchStartX=0;
boardWrap.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; }, {passive:true});
boardWrap.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>30) moveLane(dx>0?1:-1);
}, {passive:true});

function endGame(){
  running=false;
  clearInterval(spawnTimer);
  const finalScore=Math.floor(score);
  if(finalScore>best){ best=finalScore; saveBest(best); bestEl.textContent=best; }
  overlay.querySelector('.overlay-text').textContent='Crashed!';
  overlay.querySelector('.overlay-sub').textContent=`Score: ${finalScore}`;
  overlayBtn.textContent='Try Again';
  overlay.style.display='flex';
}

overlayBtn.addEventListener('click', reset);
window.addEventListener('resize', resize);

resize();
best=loadBest(); bestEl.textContent=best;
running=false; overlay.style.display='flex';
loop();
})();
</script>
</body>
</html>
