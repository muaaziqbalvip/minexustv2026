<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sudoku — MINEXUS Games</title>
<meta name="theme-color" content="#faf8f0">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#faf8f0;color:#333;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;user-select:none}
.top-bar{width:100%;max-width:380px;display:flex;justify-content:space-between;margin-bottom:12px}
.stat-box{background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px 14px;text-align:center;min-width:60px}
.stat-label{font-size:9px;color:#888;text-transform:uppercase;font-weight:700}
.stat-val{font-size:15px;font-weight:900}
.diff-select{display:flex;gap:6px;margin-bottom:12px}
.diff-btn{background:#fff;border:1px solid #ddd;color:#666;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer}
.diff-btn.active{background:#4a7c59;color:#fff;border-color:#4a7c59}
.sudoku-grid{display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:378px;aspect-ratio:1;border:2px solid #333;background:#333;gap:1px}
.sudoku-cell{
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;cursor:pointer;position:relative;color:#333;
}
.sudoku-cell.given{background:#f0ede0;color:#555;cursor:default}
.sudoku-cell.selected{background:#cde4c9}
.sudoku-cell.error{color:#e53935}
.sudoku-cell.border-r{border-right:2px solid #333}
.sudoku-cell.border-b{border-bottom:2px solid #333}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:378px;margin-top:14px}
.num-btn{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px 0;font-size:16px;font-weight:800;cursor:pointer;color:#333}
.num-btn:active{background:#4a7c59;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
.overlay.show{display:flex}
.overlay-text{font-size:26px;font-weight:900;color:#fff}
.overlay-btn{background:#4a7c59;color:#fff;border:none;border-radius:10px;padding:12px 26px;font-weight:800;cursor:pointer}
.hint{margin-top:14px;font-size:11.5px;color:#888;text-align:center;max-width:320px;line-height:1.5}
</style>
</head>
<body>
<div class="top-bar">
  <div class="stat-box"><div class="stat-label">Time</div><div class="stat-val" id="timer">0:00</div></div>
  <div class="stat-box"><div class="stat-label">Errors</div><div class="stat-val" id="errors">0</div></div>
</div>
<div class="diff-select">
  <button class="diff-btn active" data-clues="40">Easy</button>
  <button class="diff-btn" data-clues="32">Medium</button>
  <button class="diff-btn" data-clues="26">Hard</button>
</div>
<div class="sudoku-grid" id="grid"></div>
<div class="numpad" id="numpad"></div>
<p class="hint">Tap a cell, then tap a number. Fill every row, column, and 3×3 box with 1-9. Works fully offline once downloaded.</p>
<div class="overlay" id="overlay">
  <div class="overlay-text">🎉 Solved!</div>
  <button class="overlay-btn" id="overlayBtn">New Puzzle</button>
</div>
<script>
(function(){
'use strict';
const gridEl=document.getElementById('grid');
const numpadEl=document.getElementById('numpad');
const timerEl=document.getElementById('timer');
const errorsEl=document.getElementById('errors');
const overlay=document.getElementById('overlay');

let solution=[], puzzle=[], given=[], selected=-1, errors=0, seconds=0, timerHandle, clues=40;

function emptyGrid(){ return Array.from({length:9},()=>Array(9).fill(0)); }

function isValid(bd,r,c,v){
  for(let i=0;i<9;i++){ if(bd[r][i]===v || bd[i][c]===v) return false; }
  const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(bd[br+i][bc+j]===v) return false;
  return true;
}

function fillGrid(bd){
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    if(bd[r][c]===0){
      const nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
      for(const v of nums){
        if(isValid(bd,r,c,v)){
          bd[r][c]=v;
          if(fillGrid(bd)) return true;
          bd[r][c]=0;
        }
      }
      return false;
    }
  }
  return true;
}

function generatePuzzle(clueCount){
  const bd=emptyGrid();
  fillGrid(bd);
  solution=bd.map(r=>r.slice());
  puzzle=bd.map(r=>r.slice());
  const cellsToRemove = 81-clueCount;
  const positions=[]; for(let r=0;r<9;r++) for(let c=0;c<9;c++) positions.push([r,c]);
  positions.sort(()=>Math.random()-0.5);
  for(let i=0;i<cellsToRemove && i<positions.length;i++){
    const [r,c]=positions[i];
    puzzle[r][c]=0;
  }
  given=puzzle.map(row=>row.map(v=>v!==0));
}

function render(){
  gridEl.innerHTML='';
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const idx=r*9+c;
    const cell=document.createElement('div');
    cell.className='sudoku-cell';
    if(c===2||c===5) cell.classList.add('border-r');
    if(r===2||r===5) cell.classList.add('border-b');
    if(given[r][c]) cell.classList.add('given');
    if(idx===selected) cell.classList.add('selected');
    const val=puzzle[r][c];
    cell.textContent = val ? val : '';
    if(val && val!==solution[r][c]) cell.classList.add('error');
    cell.addEventListener('click', ()=>{ if(!given[r][c]){ selected=idx; render(); } });
    gridEl.appendChild(cell);
  }
}

function placeNumber(v){
  if(selected<0) return;
  const r=Math.floor(selected/9), c=selected%9;
  if(given[r][c]) return;
  puzzle[r][c]=v;
  if(v!==0 && v!==solution[r][c]){ errors++; errorsEl.textContent=errors; }
  render();
  checkComplete();
}

function checkComplete(){
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    if(puzzle[r][c]!==solution[r][c]) return;
  }
  clearInterval(timerHandle);
  overlay.classList.add('show');
}

function buildNumpad(){
  numpadEl.innerHTML='';
  for(let n=1;n<=9;n++){
    const btn=document.createElement('button');
    btn.className='num-btn'; btn.textContent=n;
    btn.addEventListener('click', ()=>placeNumber(n));
    numpadEl.appendChild(btn);
  }
  const eraseBtn=document.createElement('button');
  eraseBtn.className='num-btn'; eraseBtn.innerHTML='⌫';
  eraseBtn.style.gridColumn='span 1';
  eraseBtn.addEventListener('click', ()=>placeNumber(0));
  numpadEl.appendChild(eraseBtn);
}

function startTimer(){
  clearInterval(timerHandle);
  seconds=0; timerEl.textContent='0:00';
  timerHandle=setInterval(()=>{
    seconds++;
    const m=Math.floor(seconds/60), s=seconds%60;
    timerEl.textContent=`${m}:${String(s).padStart(2,'0')}`;
  },1000);
}

function newGame(){
  selected=-1; errors=0; errorsEl.textContent='0';
  overlay.classList.remove('show');
  generatePuzzle(clues);
  render();
  startTimer();
}

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    clues=parseInt(btn.dataset.clues,10);
    newGame();
  });
});
document.getElementById('overlayBtn').addEventListener('click', newGame);

document.addEventListener('keydown', e=>{
  if(e.key>='1'&&e.key<='9') placeNumber(parseInt(e.key,10));
  else if(e.key==='Backspace'||e.key==='Delete') placeNumber(0);
});

buildNumpad();
newGame();
})();
</script>
</body>
</html>
