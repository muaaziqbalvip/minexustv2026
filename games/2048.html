<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048 Ultimate — MINEXUS Games</title>
<meta name="description" content="Play 2048 Ultimate free — merge tiles to reach 2048 and beyond. Works fully offline.">
<meta name="theme-color" content="#faf8ef">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#faf8ef;color:#776e65;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px;
  touch-action:none;overscroll-behavior:none;user-select:none;
}
.top-bar{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.back-btn{color:#8f7a66;text-decoration:none;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}
.title{font-size:34px;font-weight:900;color:#776e65}
.scores{display:flex;gap:8px}
.score-box{background:#bbada0;border-radius:8px;padding:8px 14px;text-align:center;color:#fff;min-width:64px}
.score-label{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.8}
.score-val{font-size:18px;font-weight:900}
.game-intro{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.game-desc{font-size:12.5px;color:#776e65;max-width:230px;line-height:1.5}
.new-game-btn{
  background:#8f7a66;color:#fff;border:none;border-radius:8px;padding:10px 16px;
  font-weight:800;font-size:13px;cursor:pointer;
}
.board-wrap{position:relative;width:100%;max-width:420px;aspect-ratio:1;background:#bbada0;border-radius:10px;padding:10px}
.grid-bg{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;width:100%;height:100%}
.grid-cell{background:rgba(238,228,218,.35);border-radius:6px}
.tiles-layer{position:absolute;inset:10px}
.tile{
  position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:6px;font-weight:900;transition:transform .12s ease, opacity .12s ease;
}
.overlay{
  position:absolute;inset:0;background:rgba(238,228,218,.73);border-radius:10px;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.overlay.show{display:flex}
.overlay-text{font-size:28px;font-weight:900;color:#776e65}
.overlay-btn{background:#8f7a66;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-weight:800;font-size:14px;cursor:pointer}
.hint{margin-top:16px;font-size:12px;color:#8f7a66;text-align:center;max-width:340px;line-height:1.6}
.ad-slot{width:100%;max-width:420px;min-height:60px;margin-top:20px;border-radius:10px;background:#f2ede4;display:none;align-items:center;justify-content:center}
.ad-slot.show{display:flex}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/?view=games" class="back-btn" onclick="window.close(); return true;">← Back</a>
  <div class="scores">
    <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="score">0</div></div>
    <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="best">0</div></div>
  </div>
</div>

<div class="game-intro">
  <div class="title">2048</div>
  <button class="new-game-btn" id="newGameBtn">New Game</button>
</div>
<p class="game-desc" style="width:100%;max-width:420px;margin-bottom:10px">Swipe or use arrow keys to merge tiles. Reach 2048 to win — keep going for a higher score!</p>

<div class="board-wrap" id="boardWrap">
  <div class="grid-bg">
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
  </div>
  <div class="tiles-layer" id="tilesLayer"></div>
  <div class="overlay" id="overlay">
    <div class="overlay-text" id="overlayText">Game Over</div>
    <button class="overlay-btn" id="overlayBtn">Try Again</button>
  </div>
</div>

<p class="hint">Works fully offline once downloaded. Your best score is saved on this device.</p>

<script>
(function(){
  'use strict';

  const SIZE = 4;
  const STORAGE_BEST = 'minexus_2048_best';
  const TILE_COLORS = {
    2:['#eee4da','#776e65'], 4:['#ede0c8','#776e65'], 8:['#f2b179','#f9f6f2'],
    16:['#f59563','#f9f6f2'], 32:['#f67c5f','#f9f6f2'], 64:['#f65e3b','#f9f6f2'],
    128:['#edcf72','#f9f6f2'], 256:['#edcc61','#f9f6f2'], 512:['#edc850','#f9f6f2'],
    1024:['#edc53f','#f9f6f2'], 2048:['#edc22e','#f9f6f2']
  };

  let board, score, best, won, over;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const tilesLayer = document.getElementById('tilesLayer');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const boardWrap = document.getElementById('boardWrap');

  function loadBest() {
    try { return parseInt(localStorage.getItem(STORAGE_BEST) || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORAGE_BEST, String(v)); } catch (e) {}
  }

  function emptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === 0) empties.push([r, c]);
    if (!empties.length) return;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function newGame() {
    board = emptyBoard();
    score = 0; won = false; over = false;
    overlay.classList.remove('show');
    addRandomTile(); addRandomTile();
    render();
  }

  function slideRowLeft(row) {
    let vals = row.filter(v => v !== 0);
    let gained = 0;
    for (let i = 0; i < vals.length - 1; i++) {
      if (vals[i] === vals[i + 1]) {
        vals[i] *= 2;
        gained += vals[i];
        vals.splice(i + 1, 1);
      }
    }
    while (vals.length < SIZE) vals.push(0);
    return { row: vals, gained };
  }

  function rotateBoard(b) {
    // Rotates 90deg clockwise — used to reuse slideRowLeft for all 4 directions.
    const n = b.length;
    const res = emptyBoard();
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) res[c][n - 1 - r] = b[r][c];
    return res;
  }

  function move(direction) {
    if (over) return;
    let moved = false;
    let gainedTotal = 0;
    let rotations = { left: 0, up: 1, right: 2, down: 3 }[direction];

    let working = board;
    for (let i = 0; i < rotations; i++) working = rotateBoard(working);

    const newBoard = [];
    for (let r = 0; r < SIZE; r++) {
      const { row, gained } = slideRowLeft(working[r]);
      gainedTotal += gained;
      if (row.join(',') !== working[r].join(',')) moved = true;
      newBoard.push(row);
    }

    let finalBoard = newBoard;
    // Rotate back the remaining (4 - rotations) times.
    for (let i = 0; i < (4 - rotations) % 4; i++) finalBoard = rotateBoard(finalBoard);

    if (moved) {
      board = finalBoard;
      score += gainedTotal;
      addRandomTile();
      render();
      checkWin();
      checkGameOver();
    }
  }

  function checkWin() {
    if (won) return;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 2048) {
        won = true;
        overlayText.textContent = '🎉 You reached 2048!';
        overlay.classList.add('show');
      }
    }
  }

  function checkGameOver() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return;
    }
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const v = board[r][c];
      if (c < SIZE - 1 && board[r][c + 1] === v) return;
      if (r < SIZE - 1 && board[r + 1][c] === v) return;
    }
    over = true;
    overlayText.textContent = 'Game Over';
    overlay.classList.add('show');
  }

  function render() {
    scoreEl.textContent = score;
    if (score > best) { best = score; saveBest(best); }
    bestEl.textContent = best;

    tilesLayer.innerHTML = '';
    const cellGap = 10;
    const wrapRect = boardWrap.getBoundingClientRect();
    const innerSize = wrapRect.width - 20; // minus padding
    const cellSize = (innerSize - cellGap * (SIZE - 1)) / SIZE;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (!v) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        const [bg, fg] = TILE_COLORS[v] || ['#3c3a32', '#f9f6f2'];
        tile.style.background = bg;
        tile.style.color = fg;
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';
        tile.style.left = c * (cellSize + cellGap) + 'px';
        tile.style.top = r * (cellSize + cellGap) + 'px';
        tile.style.fontSize = (v < 100 ? 32 : v < 1000 ? 26 : 20) + 'px';
        tile.textContent = v;
        tilesLayer.appendChild(tile);
      }
    }
  }

  // ---- Input handling ----
  document.addEventListener('keydown', e => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  let touchStartX = 0, touchStartY = 0;
  boardWrap.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  boardWrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; // tap, not swipe
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('overlayBtn').addEventListener('click', newGame);

  window.addEventListener('resize', render);

  best = loadBest();
  bestEl.textContent = best;
  newGame();
})();
</script>
</body>
</html>
