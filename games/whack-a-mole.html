<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whack-a-Mole — MINEXUS Games</title>
<meta name="theme-color" content="#2e7d32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#1b3a1e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;user-select:none}
.top-bar{width:100%;max-width:400px;display:flex;justify-content:space-between;margin-bottom:14px}
.stat-box{background:rgba(255,255,255,.1);border-radius:8px;padding:8px 16px;text-align:center;min-width:64px}
.stat-label{font-size:9px;opacity:.75;text-transform:uppercase;font-weight:700}
.stat-val{font-size:18px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px}
.hole{
  aspect-ratio:1;background:#0d2410;border-radius:50%;position:relative;overflow:hidden;
  border:4px solid #5a3a1e;cursor:pointer;
}
.mole{
  position:absolute;bottom:-100%;left:10%;width:80%;height:80%;
  background:#8d6e63;border-radius:50% 50% 45% 45%;transition:bottom .12s;
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.hole.up .mole{bottom:0}
.hole.hit .mole{background:#e57373}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
.overlay.show{display:flex}
.overlay-text{font-size:28px;font-weight:900}
.overlay-sub{font-size:14px;opacity:.8}
.overlay-btn{background:#66bb6a;color:#08240a;border:none;border-radius:10px;padding:12px 26px;font-weight:900;cursor:pointer;font-size:15px}
.hint{margin-top:16px;font-size:12px;opacity:.75;text-align:center;max-width:320px;line-height:1.5}
</style>
</head>
<body>
<div class="top-bar">
  <div class="stat-box"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
  <div class="stat-box"><div class="stat-label">Time</div><div class="stat-val" id="timer">30</div></div>
  <div class="stat-box"><div class="stat-label">Best</div><div class="stat-val" id="best">0</div></div>
</div>
<div class="grid" id="grid"></div>
<p class="hint">Tap the moles as fast as you can before time runs out. Works fully offline once downloaded.</p>
<div class="overlay" id="overlay">
  <div class="overlay-text">🔨 Whack-a-Mole</div>
  <div class="overlay-sub" id="overlaySub">Tap moles as they pop up — 30 seconds!</div>
  <button class="overlay-btn" id="overlayBtn">Start</button>
</div>
<script>
(function(){
'use strict';
const STORAGE_BEST='minexus_whack_best';
function loadBest(){try{return parseInt(localStorage.getItem(STORAGE_BEST)||'0',10)||0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem(STORAGE_BEST,String(v));}catch(e){}}

const gridEl=document.getElementById('grid');
const scoreEl=document.getElementById('score'), timerEl=document.getElementById('timer'), bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'), overlaySub=document.getElementById('overlaySub'), overlayBtn=document.getElementById('overlayBtn');

const HOLE_COUNT=9;
let holes=[], score=0, best=0, timeLeft=30, gameTimer=null, moleTimer=null, activeHole=-1, running=false;

for(let i=0;i<HOLE_COUNT;i++){
  const hole=document.createElement('div');
  hole.className='hole';
  hole.innerHTML='<div class="mole">🐹</div>';
  hole.addEventListener('pointerdown', ()=>whack(i));
  gridEl.appendChild(hole);
  holes.push(hole);
}

function popRandom(){
  if(activeHole>=0) holes[activeHole].classList.remove('up','hit');
  activeHole = Math.floor(Math.random()*HOLE_COUNT);
  holes[activeHole].classList.add('up');
  const upTime = Math.max(450, 1000 - score*10);
  clearTimeout(moleTimer);
  moleTimer=setTimeout(()=>{
    if(activeHole>=0) holes[activeHole].classList.remove('up');
    if(running) popRandom();
  }, upTime);
}

function whack(i){
  if(!running || i!==activeHole) return;
  holes[i].classList.add('hit');
  score++; scoreEl.textContent=score;
  setTimeout(()=>holes[i].classList.remove('up','hit'),100);
  clearTimeout(moleTimer);
  popRandom();
}

function startGame(){
  score=0; timeLeft=30; running=true;
  scoreEl.textContent='0'; timerEl.textContent='30';
  overlay.classList.remove('show');
  popRandom();
  clearInterval(gameTimer);
  gameTimer=setInterval(()=>{
    timeLeft--;
    timerEl.textContent=timeLeft;
    if(timeLeft<=0) endGame();
  },1000);
}

function endGame(){
  running=false;
  clearInterval(gameTimer); clearTimeout(moleTimer);
  holes.forEach(h=>h.classList.remove('up','hit'));
  if(score>best){ best=score; saveBest(best); bestEl.textContent=best; }
  overlaySub.textContent = `Final score: ${score}`;
  overlayBtn.textContent='Play Again';
  overlay.querySelector('.overlay-text').textContent = score>=15 ? '🏆 Great Reflexes!' : 'Time\'s Up!';
  overlay.classList.add('show');
}

overlayBtn.addEventListener('click', startGame);
best=loadBest(); bestEl.textContent=best;
overlay.classList.add('show');
})();
</script>
</body>
</html>
